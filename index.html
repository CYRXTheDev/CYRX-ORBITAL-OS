<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CYRX SentinelOS</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>

    <header>
      <nav class="navbar">
        <div class="nav-brand">
          <img src="assets/logo.png" alt="CYRX SentinelOS Logo" />
          <h1 class="header-title">
            <span style="color: antiquewhite">CYRX</span> ORBITAL
            <span style="color: #6897dd">OS</span>
          </h1>
        </div>

        <!-- Search Bar -->
        <div class="search-container">
          <svg
            class="search-icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>

          <input
            type="text"
            id="search-input"
            placeholder="Search anything..."
          />
        </div>

        <!-- Right Side Controls -->
        <div class="nav-right">
          <div class="status-icons">
            <div class="wifi-container" id="wifi-status">
              <svg
                class="wifi-icon"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M5 12.55a11 11 0 0 1 14 0"></path>
                <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                <line x1="12" y1="20" x2="12.01" y2="20"></line>
              </svg>
            </div>
          </div>

          <div class="time-container">
            <span id="time"></span>
          </div>
        </div>
      </nav>
    </header>

    <!-- Sidebar -->
    <aside>
      <div class="sidebar">
        <ul>
          <li>
            <a id="home-link" href="#">
              <img src="assets/home.png" alt="Home logo" />
              <span>Home</span>
            </a>
          </li>
          <li>
            <a id="explorer-link" href="#">
              <img src="assets/explorer.png" alt="Explorer logo" />
              <span>Explorer</span>
            </a>
          </li>
          <li>
            <a id="gallery-link" href="#">
              <img src="assets/gallery.png" alt="Gallery logo" />
              <span>Gallery</span>
            </a>
          </li>
          <li>
            <a id="notes-link" href="#">
              <img src="assets/notes.png" alt="Notes logo" />
              <span>Notes</span>
            </a>
          </li>
          <li>
            <a id="terminal-link" href="#">
              <img src="assets/terminal.png" alt="Terminal logo" />
              <span>Terminal</span>
            </a>
          </li>
          <li>
            <a id="settings-link" href="#">
              <img src="assets/settings.png" alt="Settings logo" />
              <span>Settings</span>
            </a>
          </li>
        </ul>
      </div>
    </aside>

    <!-- Wallpaper -->
    <div class="wallpaper"></div>
      <img src="assets/wallpaper.png" alt="Wallpaper" />
    </div>

    <!-- Windows-style Taskbar -->
    <footer class="taskbar">
      <div class="taskbar-apps">
        <button type="button" class="taskbar-icon">
          <img src="assets/home.png" alt="Home App" />
        </button>
        <button type="button" class="taskbar-icon">
          <img src="assets/explorer.png" alt="Explorer App" />
        </button>
        <button type="button" class="taskbar-icon">
          <img src="assets/gallery.png" alt="Gallery App" />
        </button>
        <button type="button" class="taskbar-icon">
          <img src="assets/notes.png" alt="Notes App" />
        </button>
        <button type="button" class="taskbar-icon">
          <img src="assets/terminal.png" alt="Terminal App" />
        </button>
        <button type="button" class="taskbar-icon">
          <img src="assets/settings.png" alt="Settings App" />
        </button>
      </div>
    </footer>
    <script src="script/script.js"></script>
  </body>
</html>
